<svg xmlns="http://www.w3.org/2000/svg" width="1066" height="706" viewBox="0 0 1066 706"><defs><marker id="arr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1066" height="706" fill="#FFFFFF"/><text x="24.0" y="30.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="start">1. Course phase (whole class)</text><rect x="24.0" y="52.0" width="150" height="44" rx="14" fill="#E3F0FB" stroke="#2E6295" stroke-width="1.6"/><text x="99.0" y="79.6" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Setup</text><rect x="313.4" y="52.0" width="150" height="44" rx="14" fill="#E3F0FB" stroke="#2E6295" stroke-width="1.6"/><text x="388.4" y="79.6" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Published</text><rect x="602.7" y="52.0" width="150" height="44" rx="14" fill="#E3F0FB" stroke="#2E6295" stroke-width="1.6"/><text x="677.7" y="79.6" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Expired</text><rect x="892.1" y="52.0" width="150" height="44" rx="14" fill="#E3F0FB" stroke="#2E6295" stroke-width="1.6"/><text x="967.1" y="79.6" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Finalized</text><path d="M174.0,74.0 L313.4,74.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/><path d="M463.4,74.0 L602.7,74.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/><path d="M752.7,74.0 L892.1,74.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/><text x="99.0" y="120.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">Admin imports students,</text><text x="99.0" y="137.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">generates ⌈n ÷ max size × k⌉</text><text x="99.0" y="154.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">rooms and sets group types;</text><text x="99.0" y="171.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">students rate skills 1–5</text><text x="388.4" y="120.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">Students join, leave and</text><text x="388.4" y="137.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">apply; room leaders lock,</text><text x="388.4" y="154.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">review applications and</text><text x="388.4" y="171.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">remove members</text><text x="677.7" y="120.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">Students are frozen;</text><text x="677.7" y="137.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">pending applications are</text><text x="677.7" y="154.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">rejected; the admin moves</text><text x="677.7" y="171.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">and places students</text><text x="967.1" y="120.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">Rooms become numbered</text><text x="967.1" y="137.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">official groups; students</text><text x="967.1" y="154.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">and the lecturer see</text><text x="967.1" y="171.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">the read-only list</text><path d="M24,198.0 H1042.1" stroke="#D1D5DB" stroke-width="1.2"/><text x="24.0" y="232.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="start">2. Room status</text><rect x="128.0" y="295.0" width="150" height="58" rx="14" fill="#E3F0FB" stroke="#2E6295" stroke-width="1.6"/><text x="203.0" y="321.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Open</text><text x="203.0" y="340.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">anyone may join</text><rect x="447.2" y="295.0" width="150" height="58" rx="14" fill="#E3F0FB" stroke="#2E6295" stroke-width="1.6"/><text x="522.2" y="321.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Locked</text><text x="522.2" y="340.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">apply to join</text><path d="M278.0,313.0 L447.2,313.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/><path d="M447.2,335.0 L278.0,335.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/><rect x="110.0" y="255.0" width="505.2" height="151.0" rx="16" fill="none" stroke="#2E6295" stroke-width="1.4" stroke-dasharray="8 5"/><text x="601.2" y="277.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#2E6295" text-anchor="end">course Published or Expired</text><circle cx="32" cy="324.0" r="7" fill="#374151"/><path d="M39.0,324.0 L128.0,324.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/><rect x="277.6" y="457.0" width="170" height="58" rx="14" fill="#E3F0FB" stroke="#2E6295" stroke-width="1.6"/><text x="362.6" y="483.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Finalized</text><text x="362.6" y="502.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">official group</text><path d="M362.6,406.0 L362.6,457.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/><text x="667.2" y="266.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="start">Rules</text><circle cx="671.21796875" cy="289.5" r="2.6" fill="#1F2937"/><text x="683.2" y="294.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">The first student to join becomes the leader; if the leader leaves,</text><text x="683.2" y="311.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">the earliest member takes over.</text><circle cx="671.21796875" cy="332.5" r="2.6" fill="#1F2937"/><text x="683.2" y="337.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">A student is in at most one room per course; joining a room</text><text x="683.2" y="354.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">cancels their other applications.</text><circle cx="671.21796875" cy="375.5" r="2.6" fill="#1F2937"/><text x="683.2" y="380.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">Until the course expires, students may leave a room, and the</text><text x="683.2" y="397.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">leader may remove a member with a reason; a removed student</text><text x="683.2" y="414.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">cannot join or apply to that room again.</text><circle cx="671.21796875" cy="435.5" r="2.6" fill="#1F2937"/><text x="683.2" y="440.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">Applications exist only for Locked rooms; the leader approves or</text><text x="683.2" y="457.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">rejects them. A full room takes no one until a seat frees up.</text><circle cx="671.21796875" cy="478.5" r="2.6" fill="#1F2937"/><text x="683.2" y="483.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">Every join or approval keeps enough free seats for the majors the</text><text x="683.2" y="500.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">group type still needs (minimum per major, minimum number of</text><text x="683.2" y="517.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">different majors).</text><circle cx="671.21796875" cy="538.5" r="2.6" fill="#1F2937"/><text x="683.2" y="543.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">A room is eligible when it has at least the minimum group size</text><text x="683.2" y="560.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">and the majors its group type requires.</text><circle cx="671.21796875" cy="581.5" r="2.6" fill="#1F2937"/><text x="683.2" y="586.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">Skills are self-rated strengths (1–5): shown to students and</text><text x="683.2" y="603.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">leaders and used for room suggestions; they never block a join.</text><circle cx="671.21796875" cy="624.5" r="2.6" fill="#1F2937"/><text x="683.2" y="629.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">Finalize needs every student in a room and every non-empty</text><text x="683.2" y="646.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">room eligible (the admin may accept an exception). Empty rooms</text><text x="683.2" y="663.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">are removed; the others become numbered official groups that</text><text x="683.2" y="680.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">nobody can leave.</text><path d="M639.2,250.0 V702.0" stroke="#D1D5DB" stroke-width="1.2"/><rect x="218.3" y="50.5" width="50.8" height="18.9" fill="#FFFFFF"/><text x="243.7" y="64.5" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">Publish</text><rect x="187.0" y="79.9" width="113.4" height="18.2" fill="#FFFFFF"/><text x="243.7" y="93.4" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">admin or PublishAt</text><rect x="511.0" y="50.5" width="44.1" height="18.9" fill="#FFFFFF"/><text x="533.1" y="64.5" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">Expire</text><rect x="479.6" y="79.9" width="106.9" height="18.2" fill="#FFFFFF"/><text x="533.1" y="93.4" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">admin or ExpireAt</text><rect x="796.5" y="50.5" width="51.8" height="18.9" fill="#FFFFFF"/><text x="822.4" y="64.5" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">Finalize</text><rect x="772.0" y="79.9" width="100.9" height="18.2" fill="#FFFFFF"/><text x="822.4" y="93.4" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle">admin, all placed</text><rect x="323.8" y="289.6" width="77.7" height="18.9" fill="#FFFFFF"/><text x="362.6" y="303.6" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">leader locks</text><rect x="294.0" y="346.1" width="137.2" height="35.8" fill="#FFFFFF"/><text x="362.6" y="360.1" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">leader unlocks or</text><text x="362.6" y="377.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">room becomes empty</text><rect x="44.6" y="286.1" width="59.9" height="31.9" fill="#FFFFFF"/><text x="74.5" y="298.6" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="middle">generated</text><text x="74.5" y="313.5" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="middle">in Setup</text><rect x="370.6" y="413.6" width="141.8" height="35.8" fill="#FFFFFF"/><text x="441.5" y="427.6" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">course finalized</text><text x="441.5" y="444.5" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">(rooms with members)</text></svg>