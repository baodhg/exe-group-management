name: exe-group-demo

x-demo-limits: &demo-limits
  restart: unless-stopped
  mem_limit: 1g
  cpus: 2

x-demo-database-env: &demo-database-env
  ASPNETCORE_ENVIRONMENT: Production
  Database__MigrateOnStartup: "true"

configs:
  web-real-ip:
    content: |
      set_real_ip_from 10.0.0.0/8;
      set_real_ip_from 172.16.0.0/12;
      set_real_ip_from 192.168.0.0/16;
      set_real_ip_from 173.245.48.0/20;
      set_real_ip_from 103.21.244.0/22;
      set_real_ip_from 103.22.200.0/22;
      set_real_ip_from 103.31.4.0/22;
      set_real_ip_from 141.101.64.0/18;
      set_real_ip_from 108.162.192.0/18;
      set_real_ip_from 190.93.240.0/20;
      set_real_ip_from 188.114.96.0/20;
      set_real_ip_from 197.234.240.0/22;
      set_real_ip_from 198.41.128.0/17;
      set_real_ip_from 162.158.0.0/15;
      set_real_ip_from 104.16.0.0/13;
      set_real_ip_from 104.24.0.0/14;
      set_real_ip_from 172.64.0.0/13;
      set_real_ip_from 131.0.72.0/22;
      set_real_ip_from 2400:cb00::/32;
      set_real_ip_from 2606:4700::/32;
      set_real_ip_from 2803:f800::/32;
      set_real_ip_from 2405:b500::/32;
      set_real_ip_from 2405:8100::/32;
      set_real_ip_from 2a06:98c0::/29;
      set_real_ip_from 2c0f:f248::/32;
      real_ip_header X-Forwarded-For;
      real_ip_recursive on;

networks:
  edge:
    name: nginx-network
    external: true

services:
  sqlserver:
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2
    environment:
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports: !reset []

  redis:
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    ports: !reset []

  identity-service:
    <<: *demo-limits
    image: exe-group-demo/identity-service:${IMAGE_TAG:?Set IMAGE_TAG}
    environment: *demo-database-env

  group-service:
    <<: *demo-limits
    image: exe-group-demo/group-service:${IMAGE_TAG:?Set IMAGE_TAG}
    environment: *demo-database-env

  join-request-service:
    <<: *demo-limits
    image: exe-group-demo/join-request-service:${IMAGE_TAG:?Set IMAGE_TAG}
    environment: *demo-database-env

  gateway:
    <<: *demo-limits
    image: exe-group-demo/gateway:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports: !reset []

  web:
    restart: unless-stopped
    mem_limit: 128m
    cpus: 1
    image: exe-group-demo/web:${IMAGE_TAG:?Set IMAGE_TAG}
    ports: !reset []
    configs:
      - source: web-real-ip
        target: /etc/nginx/conf.d/00-real-ip.conf
    networks:
      default: {}
      edge:
        aliases:
          - exe-group-web
