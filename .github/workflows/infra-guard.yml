name: infra-guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  infra-guard:
    name: infra-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull = context.payload.pull_request;
            const pull_number = pull.number;

            const { data: ownersFile } = await github.rest.repos.getContent({ owner, repo, path: ".github/CODEOWNERS", ref: pull.base.sha });
            const entries = Buffer.from(ownersFile.content, "base64").toString("utf8")
              .split("\n").map((line) => line.trim()).filter(Boolean)
              .map((line) => line.split(/\s+/));

            const toPattern = (glob) => {
              const body = glob.replace(/^\//, "").replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\*/g, "[^/]*");
              return new RegExp(glob.endsWith("/") ? `^${body}` : `^${body}$`);
            };
            const guarded = entries.map(([glob]) => toPattern(glob));
            const approver = entries[0][1].replace(/^@/, "");

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number, per_page: 100 });
            const touched = files
              .flatMap((file) => [file.filename, file.previous_filename].filter(Boolean))
              .filter((path) => guarded.some((pattern) => pattern.test(path)));

            if (touched.length === 0) {
              core.info("This pull request changes no infrastructure files.");
              return;
            }

            core.info(`Infrastructure files changed:\n${touched.join("\n")}`);
            if (pull.user.login === approver) {
              core.info(`Opened by ${approver}, who owns these files.`);
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number, per_page: 100 });
            const approved = reviews.some((review) =>
              review.user?.login === approver && review.state === "APPROVED" && review.commit_id === pull.head.sha);
            if (!approved) {
              core.setFailed(`${approver} must approve the latest commit because it changes infrastructure files. After approving, re-run this job.`);
            }
