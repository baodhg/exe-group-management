name: infra-guard

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  infra-guard:
    name: infra-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull = context.payload.pull_request;
            const pull_number = pull.number;
            const devOpsFiles = /(^|\/)(Dockerfile(\.[^/]*)?|[^/]*\.Dockerfile|\.dockerignore|(docker-)?compose(\.[^/]*)?\.ya?ml|global\.json|nuget\.config|Directory\.Build\.[^/]*|\.gitleaks[^/]*|nginx\.conf)$/i;

            const { data: listFile } = await github.rest.repos.getContent({ owner, repo, path: ".github/devops-paths.txt", ref: context.sha });
            const devOpsPaths = Buffer.from(listFile.content, "base64").toString("utf8")
              .split("\n").map((line) => line.trim().toLowerCase()).filter(Boolean);
            const isDevOpsPath = (path) => devOpsFiles.test(path)
              || devOpsPaths.some((entry) => entry.endsWith("/") ? path.toLowerCase().startsWith(entry) : path.toLowerCase() === entry);

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number, per_page: 100 });
            if (files.length !== pull.changed_files) {
              core.setFailed(`GitHub listed ${files.length} of ${pull.changed_files} changed files, so this pull request cannot be checked. Split it into smaller ones.`);
              return;
            }

            const touched = files
              .flatMap((file) => [file.filename, file.previous_filename].filter(Boolean))
              .filter(isDevOpsPath);

            if (touched.length === 0) {
              core.info("No DevOps files changed.");
              return;
            }

            core.info(`DevOps files changed:\n${touched.join("\n")}`);
            const { data: activity } = await github.request("GET /repos/{owner}/{repo}/activity", { owner, repo, ref: `refs/heads/${pull.head.ref}`, per_page: 100 });
            const sameRepository = pull.head.repo?.full_name === `${owner}/${repo}`;
            const onlyOwnerPushed = activity.length > 0
              ? activity.every((event) => event.actor?.login === owner)
              : context.actor === owner && context.payload.action !== "edited";
            if (pull.user.login === owner && sameRepository && onlyOwnerPushed) {
              core.info(`Opened and pushed only by ${owner}, who owns these files.`);
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number, per_page: 100 });
            const latest = reviews.filter((review) => review.user?.login === owner && review.state !== "COMMENTED").at(-1);
            if (latest?.state !== "APPROVED" || latest.commit_id !== pull.head.sha) {
              core.setFailed(`${owner} must approve the latest commit because it changes DevOps files. After approving, re-run this job.`);
            }
