name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet restore ExeGroup.sln
      - run: dotnet build ExeGroup.sln --no-restore -c Release
      - run: dotnet format ExeGroup.sln --verify-no-changes --no-restore
      - name: Every model change has a migration
        run: |
          for service in IdentityService/ExeGroup.Identity GroupService/ExeGroup.Group JoinRequestService/ExeGroup.JoinRequest; do
            dotnet ef migrations has-pending-model-changes --no-build --configuration Release \
              --project "src/$service.Repositories" --startup-project "src/$service.API"
          done
      - run: dotnet test --solution ExeGroup.sln --no-build -c Release

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: node scripts/check-demo-compose.mjs
      - run: docker compose build

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker run --rm -v "$PWD/docs/architecture:/usr/local/structurizr" structurizr/structurizr validate -workspace /usr/local/structurizr/workspace.dsl
