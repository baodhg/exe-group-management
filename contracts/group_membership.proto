syntax = "proto3";

package exegroup.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "ExeGroup.Contracts.Grpc";

// Served by Group Service on http://group-service:8081 (HTTP/2 only, internal network);
// called by Join Request Service. All ids are GUID strings.
service GroupMembership {
  // Read-only snapshot: eligibility and display data on submit,
  // leadership check on list, approve and reject.
  rpc GetGroupContext (GetGroupContextRequest) returns (GetGroupContextReply);

  // Idempotent by request_id. Order of checks:
  // (1) request_id already processed, or student already in this group -> ALREADY_ADDED;
  // (2) student already in another group of the class -> ALREADY_IN_OTHER_GROUP;
  // (3) group, leader, enrollment, deadline, status and capacity rules;
  // (4) insert GroupMembers, AddMemberRequests and OutboxEvents in one transaction.
  rpc AddMemberIfEligible (AddMemberIfEligibleRequest) returns (AddMemberIfEligibleReply);
}

enum GroupStatus {
  GROUP_STATUS_UNSPECIFIED = 0;
  GROUP_STATUS_RECRUITING = 1;
  GROUP_STATUS_FULL = 2;
  GROUP_STATUS_LOCKED = 3;
  GROUP_STATUS_DISSOLVED = 4;
}

message GetGroupContextRequest {
  string group_id = 1;
  string student_id = 2;  // optional: empty when only the leader is checked
}

message GetGroupContextReply {
  bool exists = 1;
  string class_id = 2;
  string leader_id = 3;
  GroupStatus group_status = 4;
  google.protobuf.Timestamp deadline_utc = 5;
  int32 current_member_count = 6;
  int32 max_members = 7;
  string group_title = 8;
  // Fields 9-12 describe student_id; they are empty when student_id is empty.
  bool student_enrolled = 9;
  bool student_has_group_in_class = 10;
  string student_code = 11;       // snapshot from ClassEnrollments
  string student_full_name = 12;  // snapshot from ClassEnrollments
}

message AddMemberIfEligibleRequest {
  string request_id = 1;   // join request id = idempotency key
  string group_id = 2;
  string student_id = 3;
  string approver_id = 4;  // sub of the Team Leader, validated by Join Request Service
}

enum AddMemberResult {
  ADD_MEMBER_RESULT_UNSPECIFIED = 0;
  ADD_MEMBER_RESULT_ADDED = 1;
  ADD_MEMBER_RESULT_ALREADY_ADDED = 2;
  ADD_MEMBER_RESULT_GROUP_FULL = 3;
  ADD_MEMBER_RESULT_GROUP_LOCKED = 4;
  ADD_MEMBER_RESULT_GROUP_DISSOLVED = 5;
  ADD_MEMBER_RESULT_DEADLINE_PASSED = 6;
  ADD_MEMBER_RESULT_ALREADY_IN_OTHER_GROUP = 7;
  ADD_MEMBER_RESULT_NOT_ENROLLED = 8;
  ADD_MEMBER_RESULT_NOT_LEADER = 9;
  ADD_MEMBER_RESULT_GROUP_NOT_FOUND = 10;
}

message AddMemberIfEligibleReply {
  AddMemberResult result = 1;
  string membership_id = 2;  // set for ADDED and ALREADY_ADDED
  int32 current_member_count = 3;
}
